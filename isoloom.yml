# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Filestore (Google's 2021 security competition, by Google; a misc challenge) as an Isoloom spec:
# a file store that deduplicates what it stores and reports its usage.
# The challenge folder 2021/quals/misc-filestore of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2021-filestore

networks:
  lab: { cidr: 10.60.191.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the file store greets the player and shows its menu
    script: checks/probe.sh
    wait: 60

message: |
  Filestore (Google, 2021) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  Storing data that is already there costs nothing: what does the usage counter tell you?
